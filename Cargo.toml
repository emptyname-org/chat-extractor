[package]
name = "signal-filter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
autobins = false
description = "Offline GTK app for extracting chats from a Signal Desktop export"
license = "CC0-1.0"
readme = "README.md"
publish = false
keywords = ["signal", "chat", "export", "gtk", "offline"]
categories = ["gui", "text-processing"]

[[bin]]
name = "chatextractor"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_8"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
